<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার সাথে যোগাযোগ করুন</title>

<style>
.contact-box {
    max-width: 420px;
    margin: 25px auto;
    padding: 25px 20px;
    background: #ffffff;
    border-radius: 18px;
    text-align: center;
    font-family: Arial, sans-serif;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
}

.contact-box h2 {
    color: #222;
    font-size: 23px;
    margin-bottom: 22px;
}

.contact-btn {
    display: block;
    padding: 14px;
    margin: 12px 0;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: 0.3s;
}

.contact-btn:hover {
    opacity: 0.85;
    transform: scale(1.02);
}

.whatsapp { background: #25D366; }
.imo { background: #168AFF; }
.call { background: #444444; }
.messenger { background: #0084FF; }

</style>
</head>

<body>

<div class="contact-box">

    <h2>আমার সাথে যোগাযোগ করুন</h2>

    <!-- WhatsApp Link -->
    <a href="https://auctionr.org/4/e6c9f6f92bc133e13d51f018371a9d94"
       class="contact-btn whatsapp" target="_blank">
       WhatsApp এ যোগাযোগ করুন
    </a>

    <!-- IMO Link -->
    <a href="https://auctionr.org/4/acbb8bcc1229a6df3a24553545d6e8bb"
       class="contact-btn imo" target="_blank">
       IMO তে যোগাযোগ করুন
    </a>

    <!-- Call Link -->
    <a href="https://auctionr.org/4/14f54db10f23da0db7a4fb0fc53d3dad"
       class="contact-btn call">
       সরাসরি কল করুন
    </a>

    <!-- Messenger Link -->
    <a href="https://auctionr.org/4/66012afd569c76c12925423fa0264feb"
       class="contact-btn messenger" target="_blank">
       Messenger এ মেসেজ দিন
    </a>

</div>

</body>
</html>
